<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KSP Crime Analytics AI - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <nav>

        <div class="logo">
            KSP Crime AI
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>

    </nav>

    <!-- Login Form -->

    <div class="login-container">

        <h2>Officer Login</h2>

        <form id="loginForm">

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

            </div>

            <div style="margin-bottom:20px;">

                <input
                    type="checkbox"
                    id="showPassword">

                <label for="showPassword">
                    Show Password
                </label>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <p
            id="message"
            style="
                margin-top:20px;
                text-align:center;
                color:red;
                font-weight:bold;
            ">
        </p>

    </div>

    <footer>

        © 2026 KSP Crime Analytics AI Platform

    </footer>

    <script src="js/login.js"></script>

</body>
</html>
