<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>KSP Officer Login</title>

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <!-- Logo -->

        <div style="text-align:center;">

            <img src="images/ksp-logo.png"
                 alt="KSP Logo"
                 style="width:100px;">

            <h2 id="loginHeading">

                Karnataka State Police

            </h2>

            <p id="loginSubHeading">

                Crime Analytics AI Platform

            </p>

        </div>

        <br>

        <!-- Language Button -->

        <div style="text-align:right;">

            <button
                id="languageBtn"
                class="lang-btn">

                English

            </button>

        </div>

        <br>

        <!-- Login Form -->

        <form id="loginForm">

            <label id="userLabel">

                Officer Username

            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter Username"
                required>

            <br><br>

            <label id="passLabel">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>

            <br><br>

            <button
                type="submit"
                class="login-btn"
                style="width:100%;">

                Login

            </button>

        </form>

        <br>

        <p
            style="text-align:center;color:gray;">

            Karnataka State Police © 2026

        </p>

    </div>

</div>
<!-- ==========================================
        LOGIN JAVASCRIPT
========================================== -->

<script>

const languageBtn = document.getElementById("languageBtn");

let english = true;

languageBtn.addEventListener("click", () => {

    if (english) {

        document.getElementById("loginHeading").innerHTML =
        "ಕರ್ನಾಟಕ ರಾಜ್ಯ ಪೊಲೀಸ್";

        document.getElementById("loginSubHeading").innerHTML =
        "ಅಪರಾಧ ವಿಶ್ಲೇಷಣಾ AI ವೇದಿಕೆ";

        document.getElementById("userLabel").innerHTML =
        "ಅಧಿಕಾರಿ ಬಳಕೆದಾರ ಹೆಸರು";

        document.getElementById("passLabel").innerHTML =
        "ಗುಪ್ತಪದ";

        document.getElementById("username").placeholder =
        "ಬಳಕೆದಾರ ಹೆಸರು ನಮೂದಿಸಿ";

        document.getElementById("password").placeholder =
        "ಗುಪ್ತಪದ ನಮೂದಿಸಿ";

        document.querySelector(".login-btn").innerHTML =
        "ಲಾಗಿನ್";

        languageBtn.innerHTML = "ಕನ್ನಡ";

    }

    else{

        document.getElementById("loginHeading").innerHTML =
        "Karnataka State Police";

        document.getElementById("loginSubHeading").innerHTML =
        "Crime Analytics AI Platform";

        document.getElementById("userLabel").innerHTML =
        "Officer Username";

        document.getElementById("passLabel").innerHTML =
        "Password";

        document.getElementById("username").placeholder =
        "Enter Username";

        document.getElementById("password").placeholder =
        "Enter Password";

        document.querySelector(".login-btn").innerHTML =
        "Login";

        languageBtn.innerHTML = "English";

    }

    english = !english;

});


// ==========================================
// LOGIN API
// ==========================================

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const username = document.getElementById("username").value;

    const password = document.getElementById("password").value;

    try{

        const response = await fetch("http://127.0.0.1:5000/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:username,

                password:password

            })

        });

        const data = await response.json();

        if(data.success){

            alert("Login Successful");

            window.location.href="dashboard.html";

        }

        else{

            alert(data.message || "Invalid Username or Password");

        }

    }

    catch(error){

        alert("Cannot connect to Flask Server.");

        console.log(error);

    }

});

</script>

</body>
</html>
